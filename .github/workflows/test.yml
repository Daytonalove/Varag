name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-rus fonts-dejavu-core
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt -c constraints.txt
      - run: python -m unittest discover -s tests -q
      - run: python scripts/audit_bank_compliance.py --report /tmp/compliance.json
      - run: python -c "import json; assert all(r['passed'] for r in json.load(open('/tmp/compliance.json'))['local_checks'])"
